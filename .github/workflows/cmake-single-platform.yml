name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: OverlayCore-windows-x64
          path: build/bin/Release/overlay.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $mainHead = & git ls-remote --exit-code origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the main branch.' }
          if (($mainHead -split '\s+')[0] -ne $env:GITHUB_SHA) {
            Write-Host 'A newer commit is on main; skipping publication.'
            exit 0
          }
          $oldRelease = & gh release view build-4-1 --json name --jq .name 2>$null
          if ($LASTEXITCODE -eq 0 -and $oldRelease -eq 'Build 4') {
            gh release edit build-4-1 --tag build-1 --target $env:GITHUB_SHA `
              --title 'Build 1' --notes "Windows x64 Release build for commit $env:GITHUB_SHA." --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not rename the existing release.' }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/build-4-1"
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the old build tag.' }
            exit 0
          }

          $tags = & git ls-remote --tags origin 'refs/tags/build-*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read build tags.' }
          $number = 0
          foreach ($line in $tags) {
            if ($line -match 'refs/tags/build-(\d+)$') {
              $number = [Math]::Max($number, [int]$Matches[1])
            }
          }
          $number++
          $tag = "build-$number"
          gh release create $tag build/bin/Release/overlay.exe `
            --target $env:GITHUB_SHA `
            --title "Build $number" `
            --notes "Windows x64 Release build for commit $env:GITHUB_SHA." `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub Release.' }
